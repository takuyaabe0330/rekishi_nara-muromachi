    :root {

      --card-bg: #fff;
    }
    body {

      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      margin: 20px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      box-sizing: border-box;
      position: relative;
    }
    h1, h2 { text-align: center; margin-top: 0; }
    .hidden { display: none !important; }
    
    /* 時代選択セレクトボックス */
    .filter-group {
      margin: 20px 0;
      text-align: center;
    }
    .filter-group label {
      font-weight: bold;
      margin-right: 8px;
    }
    .filter-select {
      padding: 8px 14px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      margin: 10px 0;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: all 0.2s ease;
    }
    .btn:hover { background-color: var(--primary-color); color: #fff; }
    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;
    }
    .btn-primary:hover { background-color: var(--hover-color); }
    .btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .correct-btn { background-color: #2e7d32 !important; color: white !important; border-color: #2e7d32 !important; }
    .wrong-btn { background-color: #c62828 !important; color: white !important; border-color: #c62828 !important; }
    #progress { text-align: center; font-weight: bold; margin-bottom: 15px; color: #555; }
    #question-text { font-size: 17px; line-height: 1.6; margin-bottom: 20px; font-weight: 500; }
    #explanation-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8eaf6;
      border-left: 5px solid var(--primary-color);
      border-radius: 4px;
    }
    .score-display { font-size: 24px; text-align: center; margin: 20px 0; font-weight: bold; }
    .high-score { text-align: center; font-size: 14px; color: #777; margin-top: 10px; }

    /* 満点演出 */
    .perfect-banner {
      animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
      margin-bottom: 15px;
    }
    .perfect-badge {
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
      color: #b78103;
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 50%, #ffae00 100%);
      padding: 8px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 174, 0, 0.5);
      border: 2px solid #fff;
      animation: pulse 1.8s infinite;
    }
    .perfect-title {
      font-size: 30px;
      color: #e65100;
      margin: 15px 0 5px 0;
    }
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }

    const QUESTION_COUNT = 10;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    window.onload = () => {
      updateHighScoreDisplay();
    };

    function getStorageKey() {
      const selectedEra = document.getElementById('era-select').value;
      return `quizHighScore_中学歴史（奈良・平安・鎌倉・室町）5択クイズ_${selectedEra}`;
    }

    function updateHighScoreDisplay() {
      const key = getStorageKey();
      const highScore = localStorage.getItem(key) || 0;
      document.getElementById('high-score-display').innerText = `この設定の最高得点: ${highScore} / ${QUESTION_COUNT}点`;
    }

    function startQuiz() {
      const selectedEra = document.getElementById('era-select').value;
      let pool = allQuizData;
      if (selectedEra !== 'all') {
        pool = allQuizData.filter(q => q.era === selectedEra);
      }

      currentQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, QUESTION_COUNT);
      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} 【${q.unit}】`;
      document.getElementById('question-text').innerText = q.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#2e7d32";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#c62828";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function triggerPerfectCelebration() {
      const celebration = document.getElementById('perfect-celebration');
      celebration.classList.remove('hidden');
      document.getElementById('result-heading').classList.add('hidden');

      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.6 },
        colors: ['#ffd700', '#ff4500', '#ff1493', '#00e676', '#00b0ff']
      });

      const duration = 3000;
      const end = Date.now() + duration;

      const frame = () => {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.75 },
          colors: ['#ffd700', '#ff6d00', '#ffffff']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.75 },
          colors: ['#ffd700', '#ff6d00', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      };
      frame();
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;

      const key = getStorageKey();
      const currentHighScore = parseInt(localStorage.getItem(key) || 0);
      const msgElement = document.getElementById('new-high-score-msg');

      if (score > currentHighScore) {
        localStorage.setItem(key, score);
        msgElement.innerText = "🎉 最高得点を更新しました！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }

      if (score === currentQuestions.length) {
        triggerPerfectCelebration();
      } else {
        document.getElementById('perfect-celebration').classList.add('hidden');
        document.getElementById('result-heading').classList.remove('hidden');
      }
    }

    function resetQuiz() {
      updateHighScoreDisplay();
      document.getElementById('perfect-celebration').classList.add('hidden');
      document.getElementById('result-heading').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
